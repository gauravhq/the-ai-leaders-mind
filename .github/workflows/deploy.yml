name: Build and deploy

on:
  push:
    branches: [main]
  # daily rebuild so scheduled (future-dated) posts publish themselves when their date arrives
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm install
      # --- BookHarness gates: any failure blocks the deploy (checklist 25) ---
      - name: Gate - blog plan (200 posts, weekly, first post one year before launch)
        run: python ci/check_blog_plan.py src
      - name: Gate - content style (0 em dashes, semicolons in band, banned-word clean)
        run: python ci/check_style.py
      - name: Build for verification (root prefix)
        env:
          PATH_PREFIX: "/"
        run: npx @11ty/eleventy --output=_verify
      # the search page links /pagefind/*, so index before the LINKS gate runs
      - name: Index the verification build for search
        run: npx pagefind --site _verify
      - name: Gate - verify built site (sitemap/feed/JSON-LD/links/em-dash/FAQ>=100)
        run: python ci/verify_site.py _verify
      # --- deploy build (project pathPrefix) ---
      - name: Build site
        env:
          PATH_PREFIX: "/the-ai-leaders-mind/"
        run: npx @11ty/eleventy
      - name: Build the search index (Pagefind)
        run: npx pagefind --site _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
